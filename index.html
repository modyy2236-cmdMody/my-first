</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎯 يلا بينا يابطل!</h1>
            <p>اختبر نفسك في Local Search و Genetic Algorithms</p>
            <div class="timer">الوقت المتبقي: <span id="timer">--:--</span></div>
        </div>

        <div class="progress-container">
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>

                <span>النسبة: <span id="progressPercent">0</span>%</span>
            </div>
        </div>

        <div id="questionsContainer"></div>

        <div class="results" id="results">
            <h2>🎉 اكتملت الاختبار! 🎉</h2>
            <div class="score" id="finalScore">0%</div>
            <div class="score-message" id="scoreMessage"></div>
            <div id="scoreDetails"></div>
            <button class="restart-btn" onclick="restartQuiz()">إعادة الاختبار</button>
        </div>

        <div class="navigation" id="navigation">
            <button class="btn-prev" onclick="prevQuestion()" id="prevBtn">← السؤال السابق</button>
            <button class="btn-next" onclick="nextQuestion()" id="nextBtn">السؤال التالي →</button>
            <button class="btn-finish" onclick="finishQuiz()" id="finishBtn" disabled>انهي الاختبار ✓</button>
        </div>
    </div>

        <div class="translate-content">
            <span class="close" onclick="closeTranslate()">&times;</span>
            <div id="translateText"></div>
        </div>

        let currentQuestionIndex = 0;

        let startTime = Date.now();
        let timerInterval;

        function initQuiz() {
            document.getElementById('totalQuestions').textContent = questions.length;
            renderQuestions();
            updateProgress();
            startTimer();
        }

        function renderQuestions() {
            const container = document.getElementById('questionsContainer');
            container.innerHTML = '';
            
            questions.forEach((q, index) => {
                const questionDiv = document.createElement('div');
                questionDiv.className = `question-container ${index === 0 ? 'active' : ''}`;
                questionDiv.id = `question-${index}`;
                
                const difficultyClass = q.difficulty === 'easy' ? 'difficulty-easy' : 
                                      q.difficulty === 'medium' ? 'difficulty-medium' : 
                                      'difficulty-hard';
                
                const difficultyText = q.difficulty === 'easy' ? 'سهل' : 
                                      q.difficulty === 'medium' ? 'متوسط' : 
                                      'صعب';

                questionDiv.innerHTML = `
                    <div class="question-number">
                        Question ${index + 1}
                        <span class="difficulty-badge ${difficultyClass}">${difficultyText}</span>
                    </div>
                    <div class="question-text">${q.question}</div>
                    <button class="translate-btn" onclick="showTranslation(${index})">🌐 اضغط لترجمة السؤال</button>
                    <div class="options">
                        ${q.options.map((option, optIndex) => `
                            <label class="option">
                                <input type="radio" name="question-${index}" value="${optIndex}" 
                                       ${answers[index] === optIndex ? 'checked' : ''} 
                                       onchange="selectAnswer(${index}, ${optIndex})">
                                ${option}
                            </label>
                        `).join('')}
                    </div>
                    <div class="explanation" id="explanation-${index}">
                        <strong>💡 الشرح:</strong> ${q.explanation}
                    </div>
                `;
                
                container.appendChild(questionDiv);
            });
        }

        function selectAnswer(questionIndex, optionIndex) {
            answers[questionIndex] = optionIndex;
            updateProgress();
            
            setTimeout(() => {
                const options = document.querySelectorAll(`#question-${questionIndex} .option`);
                const explanation = document.getElementById(`explanation-${questionIndex}`);
                
                options.forEach((option, index) => {
                    const input = option.querySelector('input');
                    option.classList.remove('correct', 'incorrect', 'disabled');
                    option.classList.add('disabled');
                    
                    if (index === questions[questionIndex].correct) {
                        option.classList.add('correct');
                    } else if (index === optionIndex) {
                        option.classList.add('incorrect');
                    }
                });
                
                explanation.classList.add('show');
            }, 200);
        }

        function showTranslation(questionIndex) {
            const question = questions[questionIndex];
            const modal = document.getElementById('translateModal');
            const translateText = document.getElementById('translateText');
            
            translateText.innerHTML = `
                <h2>ترجمة السؤال</h2>
                <p><strong>${question.arabicQuestion}</strong></p>
                <br>
                <h3>الخيارات:</h3>
                <ol>
                    ${question.options.map(opt => `<li>${opt}</li>`).join('')}
                </ol>
            `;
            
            modal.style.display = 'block';
        }

        function closeTranslate() {
            document.getElementById('translateModal').style.display = 'none';
        }

        function updateProgress() {
            const answered = Object.keys(answers).length;
            const total = questions.length;
            const percentage = Math.round((answered / total) * 100);
            
            document.getElementById('currentQuestion').textContent = currentQuestionIndex + 1;
            document.getElementById('progressPercent').textContent = percentage;
            document.getElementById('progressFill').style.width = percentage + '%';
            
            const finishBtn = document.getElementById('finishBtn');
            finishBtn.disabled = answered < total;
        }

        function nextQuestion() {
            if (currentQuestionIndex < questions.length - 1) {
                document.getElementById(`question-${currentQuestionIndex}`).classList.remove('active');
                currentQuestionIndex++;
                document.getElementById(`question-${currentQuestionIndex}`).classList.add('active');
                updateProgress();
                window.scrollTo(0, 0);
            }
        }

        function prevQuestion() {
            if (currentQuestionIndex > 0) {
                document.getElementById(`question-${currentQuestionIndex}`).classList.remove('active');
                currentQuestionIndex--;
                document.getElementById(`question-${currentQuestionIndex}`).classList.add('active');
                updateProgress();
                window.scrollTo(0, 0);
            }
        }

        function startTimer() {
            timerInterval = setInterval(() => {
                const elapsed = Math.floor((Date.now() - startTime) / 1000);
                const minutes = Math.floor(elapsed / 60);
                const seconds = elapsed % 60;
                document.getElementById('timer').textContent = 
                    `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
            }, 1000);
        }

        function finishQuiz() {
            clearInterval(timerInterval);
            
            let correctCount = 0;
            questions.forEach((q, index) => {
                if (answers[index] === q.correct) {
                    correctCount++;
                }
            });
            
            const percentage = Math.round((correctCount / questions.length) * 100);
            
            let message = '';
            if (percentage >= 90) {
                message = '🎊 أسطوري! أنت خبير حقيقي! 🎊';
            } else if (percentage >= 80) {
                message = '🌟 ممتاز! أداء رائع جداً! 🌟';
            } else if (percentage >= 70) {
                message = '👏 جيد جداً! مجهود محترم! 👏';
            } else if (percentage >= 60) {
                message = '✅ جيد! تابع المذاكرة قليلاً! ✅';
            } else if (percentage >= 50) {
                message = '⚠️ متوسط! احتاج لمراجعة أفضل! ⚠️';
            } else {
                message = '💪 لا تستسلم! جرب مرة أخرى! 💪';
            }
            
            document.getElementById('questionsContainer').style.display = 'none';
            document.getElementById('navigation').style.display = 'none';
            document.getElementById('results').classList.add('show');
            document.getElementById('finalScore').textContent = percentage + '%';
            document.getElementById('scoreMessage').textContent = message;
            
            document.getElementById('scoreDetails').innerHTML = `
                <div style="background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); 
                            padding: 20px; border-radius: 10px; margin: 20px 0;">
                    <p style="font-size: 1.2em; color: #333;">
                        لقد أجبت <strong>${correctCount}</strong> أسئلة بشكل صحيح من <strong>${questions.length}</strong>
                    </p>
                </div>
            `;
        }

        function restartQuiz() {
            currentQuestionIndex = 0;
            answers = {};
            startTime = Date.now();
            
            document.getElementById('questionsContainer').style.display = 'block';
            document.getElementById('navigation').style.display = 'flex';
            document.getElementById('results').classList.remove('show');
            document.getElementById('progressFill').style.width = '0%';
            document.getElementById('progressPercent').textContent = '0';
            
            renderQuestions();
            updateProgress();
            startTimer();
        }

        window.onclick = function(event) {
            const modal = document.getElementById('translateModal');
            if (event.target === modal) {
                modal.style.display = 'none';
            }
        }

        // تهيئة الاختبار عند تحميل الصفحة
        document.addEventListener('DOMContentLoaded', initQuiz);
